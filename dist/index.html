<!DOCTYPE html><html lang="ja" data-section="other"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>学問の鎖｜トップ</title><link rel="icon" type="image/png" href="./favicon/icon.png"><link rel="stylesheet" href="./css/main.css"></head> <body> <header> <div class="header-main"> <div class="header-title"> <img src="./favicon/title.svg" alt="学問の鎖のロゴ" id="logo"> <h1>トップ</h1> </div> </div> <div class="header-sticky-bar">   <input type="checkbox" id="header-menu-toggle" class="header-menu-toggle"> <label for="header-menu-toggle" class="header-menu-btn" aria-label="メニューを開く"> <span></span><span></span><span></span> </label>  </div> <div class="header-tools" aria-label="ページツール"> <details name="page-tools"> <summary>目次</summary> <nav class="header-details-content" aria-label="目次"> <ul> <li> <a href="#目次" class="tocLink">目次</a>  </li><li> <a href="#フィードバック" class="tocLink">フィードバック</a>  </li> </ul> </nav> </details>   </div> <div class="reading-progress" aria-hidden="true"></div> </header> <main>  <p>理系学生のための独学学習サイトという体で書き進める私の学習メモです．ご自由に閲覧ください．誤字・間違いがあればご連絡ください．全ページリンクフリーです．</p> <p>一部AIによって生成されています．</p> <h2 id="目次">目次</h2> <ul> <li><a href="./math.html">数学</a></li> <li><a href="./programming.html">プログラミング</a></li> <li><a href="./search.html">用語検索</a></li> <li><a href="./reference.html">参考文献</a></li> </ul> <h2 id="フィードバック">フィードバック</h2> <p><a href="https://docs.google.com/forms/d/e/1FAIpQLScoYzrt8RFPysUVlrvwXUakq0zoJyC4sEkhnYkZBCWMAtE2-Q/viewform?usp=sharing">ここ</a>で不満点や訂正を受け付けています．</p>  </main> <footer>Copyright © raygo All Rights Reserved since 2016.</footer>     <script type="module">const updateProgress = () => {
  const scrollable = document.documentElement.scrollHeight - window.innerHeight;
  const ratio = scrollable > 0 ? window.scrollY / scrollable : 0;
  document.documentElement.style.setProperty("--reading-progress", String(Math.min(1, Math.max(0, ratio))));
};

updateProgress();

</script> <script type="module">// The mobile header sticks with a negative top offset so that the title block
// scrolls out of view and only the breadcrumb bar stays pinned. The offset is
// the title's height, which varies with the title text, so it is measured here.
// The "is-stuck" class marks the state where the bar has reached the top edge,
// which is what turns the header background translucent.
// --header-height feeds --scroll-offset, so anchor targets land below the
// pinned header instead of underneath it.
const header = document.querySelector("header");
const bar = document.querySelector(".header-sticky-bar");

if (header && bar) {
  let titleHeight = 0;

  const updateStuck = () => {
    header.classList.toggle("is-stuck", window.scrollY > titleHeight);
  };

  const updateOffset = () => {
    // Both rects shift together while stuck, so this distance stays correct.
    const offset = bar.getBoundingClientRect().top - header.getBoundingClientRect().top;
    titleHeight = Math.max(0, Math.round(offset));
    document.documentElement.style.setProperty("--header-title-height", `${titleHeight}px`);
    document.documentElement.style.setProperty("--header-height", `${Math.round(header.offsetHeight)}px`);
    updateStuck();
  };

  updateOffset();
  window.addEventListener("scroll", updateStuck, { passive: true });
  window.addEventListener("resize", updateOffset);

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(updateOffset);
  }
}
</script>   </body></html>
